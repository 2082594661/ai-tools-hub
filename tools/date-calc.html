    <div class="ad-slot ad-top" id="ad-top"></div>
    <div class="container">
        <main id="main" class="static-page tool-page">
            <section class="tool-card" id="date-calc">
                <nav class="breadcrumb" aria-label="面包屑"><a href="../index.html">首页</a><span class="sep" aria-hidden="true">›</span><span>日期计算器</span></nav>
                <div class="tool-head">
                    <span class="tool-emoji">📅</span>
                    <div>
                        <h1>日期计算器</h1>
                        <p class="tool-desc">算两个日期相差多少天，或者「某天 + 100 天是哪天」。项目排期、保质期、倒计时都常用。</p>
                    </div>
                </div>
                <div class="tool-body">
                    <h3 style="margin:.2rem 0 .8rem;">① 相差天数</h3>
                    <div class="tool-row">
                        <div class="tool-field">
                            <label for="dc-date-a">起始日期</label>
                            <input type="date" id="dc-date-a">
                        </div>
                        <div class="tool-field">
                            <label for="dc-date-b">结束日期</label>
                            <input type="date" id="dc-date-b">
                        </div>
                    </div>
                    <button class="tool-btn" id="dc-diff-btn" type="button">计算相差天数</button>
                    <div id="dc-diff-out" style="margin-top:1rem;"></div>

                    <h3 style="margin:1.6rem 0 .8rem;">② 日期推算</h3>
                    <div class="tool-row">
                        <div class="tool-field">
                            <label for="dc-from">起始日期</label>
                            <input type="date" id="dc-from">
                        </div>
                        <div class="tool-field">
                            <label for="dc-amount">数量</label>
                            <input type="number" id="dc-amount" value="100" min="0" step="1">
                        </div>
                    </div>
                    <div class="tool-row">
                        <div class="tool-field">
                            <label for="dc-unit">单位</label>
                            <select id="dc-unit">
                                <option value="day">天</option>
                                <option value="week">周</option>
                                <option value="month">月</option>
                                <option value="year">年</option>
                            </select>
                        </div>
                        <div class="tool-field">
                            <label for="dc-dir">方向</label>
                            <select id="dc-dir">
                                <option value="add">之后（加上）</option>
                                <option value="sub">之前（减去）</option>
                            </select>
                        </div>
                    </div>
                    <button class="tool-btn" id="dc-calc-btn" type="button">推算结果日期</button>
                    <div id="dc-calc-out" style="margin-top:1rem;"></div>
                </div>
            </section>
        </main>
